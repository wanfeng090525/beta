org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dkotlin.daemon.jvm.options=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=4
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false
# AGP 8.13 官方最高推荐 compileSdk 为 36，抑制使用 37 时的兼容性警告
android.suppressUnsupportedCompileSdk=37
